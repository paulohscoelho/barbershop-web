<header style="display: flex; justify-content: space-between; padding: 10px; background-color: #333; color: white; align-items: center;">
  <div>
    <strong>Barbearia</strong>
  </div>
  <nav style="display: flex; gap: 15px; align-items: center;">
    <a routerLink="/my-appointments" style="color: white; text-decoration: none; cursor: pointer;">Meus Agendamentos</a>
    <a routerLink="/new-appointment" style="color: white; text-decoration: none; cursor: pointer;">Novo Agendamento</a>
    <a routerLink="/change-password" style="color: white; text-decoration: none; cursor: pointer;">Trocar Senha</a>
    
    @if (userRole) {
      <span>Logado como: {{ userRole }}</span>
    }
    
    <button (click)="onLogout()" style="cursor: pointer; padding: 5px 10px;">Sair</button>
  </nav>
</header>
