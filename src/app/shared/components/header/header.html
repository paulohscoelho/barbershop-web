@if (showMenu) {
  <header class="bg-gray-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      
      <div class="flex-shrink-0 flex items-center">
        <span class="text-xl font-bold tracking-wider text-blue-400">Barbearia</span>
      </div>

      <nav class="flex flex-wrap justify-center md:justify-end items-center gap-2 w-full md:w-auto">
        
        @if (userRole === 'CLIENT') {
          <a routerLink="/my-appointments" class="text-sm border border-gray-600 text-gray-300 hover:text-white hover:bg-gray-800 transition-colors px-4 py-2 rounded-md">Meus Agendamentos</a>
          <a routerLink="/new-appointment" class="text-sm border border-gray-600 text-gray-300 hover:text-white hover:bg-gray-800 transition-colors px-4 py-2 rounded-md">Novo Agendamento</a>
          <a routerLink="/service-catalog" class="text-sm border border-gray-600 text-gray-300 hover:text-white hover:bg-gray-800 transition-colors px-4 py-2 rounded-md">Catálogo</a>
        }

        @if (userRole === 'BARBER' || userRole === 'ADMIN') {
          <a routerLink="/barber-agenda" class="text-sm border border-gray-600 text-gray-300 hover:text-white hover:bg-gray-800 transition-colors px-4 py-2 rounded-md">Minha Agenda</a>
          <a routerLink="/service-catalog" class="text-sm border border-gray-600 text-gray-300 hover:text-white hover:bg-gray-800 transition-colors px-4 py-2 rounded-md">Catálogo</a>
          <a routerLink="/working-hours" class="text-sm border border-gray-600 text-gray-300 hover:text-white hover:bg-gray-800 transition-colors px-4 py-2 rounded-md">Horários</a>
          <a routerLink="/clients" class="text-sm border border-gray-600 text-gray-300 hover:text-white hover:bg-gray-800 transition-colors px-4 py-2 rounded-md">Meus Clientes</a>
        }

        @if (userRole) {
          <div class="flex flex-wrap justify-center items-center gap-2 md:border-l md:border-gray-700 md:pl-4 w-full md:w-auto mt-2 md:mt-0">
            <a routerLink="/profile" class="text-sm border border-gray-600 text-gray-400 hover:text-white hover:bg-gray-800 transition-colors px-4 py-2 rounded-md">Meu Perfil</a>
            
            <span class="bg-gray-800 text-xs font-semibold px-3 py-1 rounded-full border border-gray-700">
              {{ userRole }}
            </span>
            
            <button (click)="onLogout()" class="bg-red-600 hover:bg-red-700 text-white text-sm font-bold py-1.5 px-4 rounded-md transition-colors duration-200">
              Sair
            </button>
          </div>
        }
      </nav>
    </div>
  </header>
}
