<div style="display: flex; justify-content: center; padding: 50px 20px; font-family: Arial, sans-serif;">
  <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px;">
    <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Trocar Senha</h2>
    
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 15px;">
      <div>
        <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px;">Senha Atual</label>
        <input type="password" formControlName="oldPassword" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
      </div>
      
      <div>
        <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px;">Nova Senha</label>
        <input type="password" formControlName="newPassword" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
      </div>

      <div>
        <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px;">Confirmar Nova Senha</label>
        <input type="password" formControlName="confirmPassword" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
        @if (passwordForm.get('confirmPassword')?.hasError('passwordMismatch')) {
          <small style="color: red; font-size: 12px;">As senhas não coincidem.</small>
        }
      </div>

      <button type="submit" [disabled]="passwordForm.invalid" style="width: 100%; padding: 12px; background-color: #2196F3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px;">
        Salvar Nova Senha
      </button>
    </form>

    @if (message) {
      <p [style.color]="isError ? 'red' : 'green'" style="text-align: center; margin-top: 15px; font-weight: bold;">{{ message }}</p>
    }
  </div>
</div>
