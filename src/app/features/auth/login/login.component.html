<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">
    
    <div>
      <h2 class="text-center text-3xl font-extrabold text-gray-900">
        Login
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Acesse sua conta para gerenciar seus cortes
      </p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
      <div class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
            placeholder="seu@email.com"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm" 
            placeholder="••••••••"
          />
        </div>
      </div>

      <div>
        <button 
          type="submit" 
          [disabled]="loginForm.invalid" 
          class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200"
        >
          Entrar
        </button>
      </div>
    </form>

    <div class="flex items-center justify-between mt-6">
      <div class="text-sm">
        <a href="#" class="font-medium text-blue-600 hover:text-blue-500">
          Esqueci minha senha
        </a>
      </div>
    </div>

    <div class="mt-6">
      <div class="relative">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-300"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-white text-gray-500">Não tem uma conta?</span>
        </div>
      </div>

      <div class="mt-6">
        <button class="w-full flex justify-center py-3 px-4 border border-blue-600 text-sm font-medium rounded-lg text-blue-600 bg-white hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200">
          Criar Conta
        </button>
      </div>
    </div>

    @if (errorMessage) {
      <div class="mt-4 bg-red-50 border-l-4 border-red-500 p-4 rounded">
        <p class="text-sm text-red-700">{{ errorMessage }}</p>
      </div>
    }

  </div>
</div>
