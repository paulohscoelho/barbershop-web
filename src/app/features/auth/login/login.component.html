<div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f5f5f5; font-family: Arial, sans-serif;">
  <div style="background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px;">
    <h2 style="text-align: center; color: #333; margin-bottom: 30px;">Login Barbearia</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 15px;">
      <div>
        <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px;">E-mail</label>
        <input id="email" type="email" formControlName="email" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
      </div>
      <div>
        <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px;">Senha</label>
        <input id="password" type="password" formControlName="password" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
      </div>
      
      <button type="submit" [disabled]="loginForm.invalid" style="width: 100%; padding: 12px; background-color: #2196F3; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px;">
        Entrar
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 14px;">
      <a href="#" style="color: #666; text-decoration: none;">Esqueci minha senha</a>
    </div>

    <hr style="margin: 20px 0; border: 1px solid #eee;">

    <div style="text-align: center;">
      <p style="color: #666; margin-bottom: 10px;">Não tem uma conta?</p>
      <button style="width: 100%; padding: 12px; background-color: transparent; color: #2196F3; border: 1px solid #2196F3; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;">
        Criar Conta
      </button>
    </div>

    @if (errorMessage) {
      <p style="color: red; text-align: center; margin-top: 15px;">{{ errorMessage }}</p>
    }
  </div>
</div>
